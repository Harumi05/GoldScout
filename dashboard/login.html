<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050607">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" href="/assets/hali-logo.png">
<link rel="apple-touch-icon" href="/assets/hali-logo.png">
<title>HALI — Acceso privado</title>
<style>
:root{
  --bg:#050607;--card:#0b0e11;--line:#252b32;--ink:#f2eee7;--muted:#7d848e;
  --gold:#d5ab65;--gold2:#79562d;--blood:#9c142b;--red:#ef566d;--green:#2fd3a2
}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0;background:#050607;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{
  min-height:100dvh;display:grid;place-items:center;padding:24px;
  background:
    radial-gradient(circle at 50% -10%,rgba(145,15,35,.20),transparent 30rem),
    radial-gradient(circle at 85% 80%,rgba(134,92,39,.08),transparent 28rem),
    linear-gradient(180deg,#080a0c,#030405 72%);
  overflow-x:hidden
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.20;
  background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.012) 1px,transparent 1px);
  background-size:34px 34px
}
.login-shell{width:min(100%,430px);position:relative}
.brand{text-align:center;margin-bottom:18px}
.brand img{
  width:118px;height:118px;object-fit:cover;border-radius:24px;border:1px solid #513722;
  box-shadow:0 24px 60px rgba(0,0,0,.50),0 0 38px rgba(151,18,41,.16)
}
.wordmark{font-family:Georgia,"Times New Roman",serif;font-size:38px;letter-spacing:.16em;color:#e6bd77;margin-top:14px;text-transform:uppercase}
.tagline{font-size:8px;letter-spacing:.28em;color:#6f7680;text-transform:uppercase;margin-top:6px}
.login-card{
  border:1px solid #292f36;border-radius:17px;padding:22px;
  background:linear-gradient(155deg,rgba(16,19,23,.97),rgba(7,9,11,.98));
  box-shadow:0 24px 70px rgba(0,0,0,.46),inset 0 1px 0 rgba(216,173,102,.07);
  position:relative;overflow:hidden
}
.login-card:before{
  content:"";position:absolute;left:0;right:0;top:0;height:1px;
  background:linear-gradient(90deg,transparent,#89622f,#ad1730,#89622f,transparent);opacity:.75
}
.login-card h1{font-family:Georgia,"Times New Roman",serif;font-size:19px;letter-spacing:.06em;color:#dfbd80;margin:0}
.login-card>p{font-size:9px;line-height:1.6;color:#747c86;margin:8px 0 18px}
.field{display:grid;gap:7px;margin-top:12px}
.field label{font-size:8px;letter-spacing:.12em;color:#777f89;text-transform:uppercase}
.input-wrap{position:relative}
input{
  width:100%;height:46px;border:1px solid #2a3139;border-radius:10px;background:#080b0e;
  color:#e7e9ec;padding:0 13px;font-size:14px;outline:none;transition:.18s ease
}
input:focus{border-color:#77582f;box-shadow:0 0 0 3px rgba(176,135,75,.08)}
input::placeholder{color:#4f5660}
.toggle-password{
  position:absolute;right:7px;top:50%;transform:translateY(-50%);height:32px;padding:0 8px;
  border:0;background:transparent;color:#717983;font-size:8px;letter-spacing:.06em;cursor:pointer
}
.submit{
  width:100%;height:46px;margin-top:18px;border:1px solid #6e4d2a;border-radius:10px;cursor:pointer;
  background:linear-gradient(180deg,#2b2015,#17110d);color:#ecd6ad;font-size:10px;letter-spacing:.12em;font-weight:700;
  transition:.18s ease;position:relative;overflow:hidden
}
.submit:hover{border-color:#9a713c;background:linear-gradient(180deg,#372818,#1c140e)}
.submit:disabled{opacity:.55;cursor:wait}
.submit:after{content:"";position:absolute;inset:auto 0 0;height:1px;background:linear-gradient(90deg,transparent,#b71b35,transparent)}
.error{
  display:none;margin-top:12px;padding:9px 10px;border:1px solid rgba(239,86,109,.35);border-radius:9px;
  background:rgba(110,15,30,.10);color:#e78b99;font-size:9px;line-height:1.45
}
.error.on{display:block}
.security{
  display:flex;gap:9px;align-items:flex-start;margin-top:16px;padding-top:14px;border-top:1px solid #242a31
}
.security i{width:8px;height:8px;border-radius:50%;background:#2fd3a2;box-shadow:0 0 10px rgba(47,211,162,.35);margin-top:3px;flex:0 0 auto}
.security div{font-size:8px;color:#68717b;line-height:1.55}
.footer{text-align:center;font-size:7px;color:#4f5660;letter-spacing:.08em;margin-top:14px}
@media(max-width:520px){
 body{padding:16px 14px calc(18px + env(safe-area-inset-bottom))}
 .brand{margin-bottom:14px}.brand img{width:92px;height:92px;border-radius:20px}
 .wordmark{font-size:31px;margin-top:11px}.tagline{font-size:7px}
 .login-card{padding:18px;border-radius:15px}
 input,.submit{height:44px}
}
</style>
</head>
<body>
<main class="login-shell">
  <div class="brand">
    <img src="/assets/hali-logo.png" alt="Hali" onerror="this.style.display='none'">
    <div class="wordmark">HALI</div>
    <div class="tagline">Private Gold Trading Terminal</div>
  </div>

  <section class="login-card">
    <h1>Acceso privado</h1>
    <p>Terminal protegido de Hali. Ingresa con el usuario y contraseña asignados.</p>

    <form id="loginForm" autocomplete="on">
      <div class="field">
        <label for="username">Usuario</label>
        <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Tu usuario" required>
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <div class="input-wrap">
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••••" required>
          <button id="togglePassword" class="toggle-password" type="button">MOSTRAR</button>
        </div>
      </div>

      <button id="submit" class="submit" type="submit">ENTRAR A HALI</button>
      <div id="error" class="error" role="alert"></div>
    </form>

    <div class="security">
      <i></i>
      <div>Sesión cifrada sobre HTTPS. La contraseña no se guarda en el navegador por Hali y nunca se envía a GitHub.</div>
    </div>
  </section>

  <div class="footer">HALI · XAUUSD INTELLIGENCE · PRIVATE ACCESS</div>
</main>
<script>
const form=document.getElementById('loginForm');
const errorBox=document.getElementById('error');
const submit=document.getElementById('submit');
const password=document.getElementById('password');
const toggle=document.getElementById('togglePassword');

function showError(message){
  errorBox.textContent=message||'No fue posible iniciar sesión.';
  errorBox.classList.add('on');
}
toggle.addEventListener('click',()=>{
  const visible=password.type==='text';
  password.type=visible?'password':'text';
  toggle.textContent=visible?'MOSTRAR':'OCULTAR';
});

async function alreadyAuthenticated(){
  try{
    const r=await fetch('/api/auth/status',{cache:'no-store'});
    const d=await r.json();
    if(d.authenticated) location.replace('/');
  }catch(_){}
}
alreadyAuthenticated();

form.addEventListener('submit',async event=>{
  event.preventDefault();
  errorBox.classList.remove('on');
  submit.disabled=true;submit.textContent='VERIFICANDO…';
  try{
    const r=await fetch('/api/login',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        username:document.getElementById('username').value.trim(),
        password:password.value
      })
    });
    const d=await r.json().catch(()=>({}));
    if(!r.ok){
      if(r.status===429) showError('Demasiados intentos. Espera unos minutos antes de volver a intentar.');
      else if(r.status===503) showError('El acceso de Hali aún no está configurado en el servidor.');
      else showError('Usuario o contraseña incorrectos.');
      return;
    }
    location.replace('/');
  }catch(e){
    showError('No se pudo conectar con Hali. Intenta nuevamente.');
  }finally{
    submit.disabled=false;submit.textContent='ENTRAR A HALI';
  }
});
</script>
</body>
</html>
